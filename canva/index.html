<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="theme-color" content="#1a1a1a">
		<title>Tachyon Guide — Uma Musume Tools</title>
		<meta name="description" content="The Tachyon Guide for Uma Musume — community guide hosted on Canva.">

		<!-- Open Graph / social share previews -->
		<meta property="og:type" content="website">
		<meta property="og:site_name" content="Uma Musume Tools">
		<meta property="og:title" content="Tachyon Guide">
		<meta property="og:description" content="The Tachyon Guide for Uma Musume — community guide hosted on Canva.">
		<meta property="og:url" content="https://canva.umalator.app/">
		<meta name="twitter:card" content="summary">
		<meta name="twitter:title" content="Tachyon Guide — Uma Musume Tools">
		<meta name="twitter:description" content="The Tachyon Guide for Uma Musume — community guide hosted on Canva.">

		<!-- Favicon (matches every other tool's icon, served via /uma-tools/ rewrite) -->
		<link rel="icon" type="image/svg+xml" href="/uma-tools/umalator-global/favicon.svg">

		<!-- Start TLS handshake to Canva early so the iframe paints sooner -->
		<link rel="preconnect" href="https://www.canva.com" crossorigin>
		<link rel="dns-prefetch" href="https://www.canva.com">

		<style>
			* { margin: 0; padding: 0; box-sizing: border-box; }
			html, body {
				width: 100vw;
				height: 100vh;
				overflow: hidden;
				background: #1a1a1a;
				font-family: system-ui, -apple-system, "DM Sans", sans-serif;
				color: #d0d0d0;
			}

			/* Subtle pre-iframe loading hint so users don't stare at a blank dark page */
			.loading-hint {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 0.9rem;
				color: #666;
				letter-spacing: 0.04em;
				pointer-events: none;
				z-index: 0;
				animation: pulse 1.6s ease-in-out infinite;
			}
			@keyframes pulse {
				0%, 100% { opacity: 0.5; }
				50% { opacity: 0.9; }
			}

			iframe {
				position: fixed;
				inset: 0;
				width: 100%;
				height: 100%;
				border: 0;
				background: transparent;
				z-index: 1;
			}

			/* Fixed fallback link — mirrors functions/[[catchall]].ts .attr pattern */
			.fallback {
				position: fixed;
				bottom: 0.5rem;
				right: 0.75rem;
				z-index: 2;
				font-size: 0.72rem;
				color: rgba(255, 255, 255, 0.55);
				background: rgba(0, 0, 0, 0.35);
				padding: 4px 8px;
				border-radius: 4px;
				text-decoration: none;
				transition: color 120ms ease, background 120ms ease;
				backdrop-filter: blur(4px);
				-webkit-backdrop-filter: blur(4px);
			}
			.fallback:hover,
			.fallback:focus-visible {
				color: rgba(255, 255, 255, 0.95);
				background: rgba(0, 0, 0, 0.6);
				outline: none;
			}

			.no-js {
				position: fixed;
				inset: 0;
				display: flex;
				align-items: center;
				justify-content: center;
				padding: 2rem;
				text-align: center;
				font-size: 1rem;
				color: #aaa;
				z-index: 3;
			}
		</style>
	</head>
	<body>
		<div class="loading-hint" aria-hidden="true">Loading Tachyon Guide…</div>

		<iframe
			src="https://www.canva.com/design/DAHKLz3Q9xA/ZZA2FZOn77TI9zXxiHqR3w/view?embed"
			title="Tachyon Guide"
			loading="lazy"
			allowfullscreen
			allow="fullscreen"
			referrerpolicy="strict-origin-when-cross-origin"
		></iframe>

		<a
			class="fallback"
			href="https://www.canva.com/design/DAHKLz3Q9xA/ZZA2FZOn77TI9zXxiHqR3w/view?utm_content=DAHKLz3Q9xA&utm_campaign=designshare&utm_medium=embeds&utm_source=link"
			target="_blank"
			rel="noopener"
		>Open on Canva ↗</a>

		<noscript>
			<div class="no-js">
				The Tachyon Guide embed requires JavaScript.<br>
				Open it directly at
				<a href="https://www.canva.com/design/DAHKLz3Q9xA/ZZA2FZOn77TI9zXxiHqR3w/view" target="_blank" rel="noopener" style="color:#7fbf7e">canva.com</a>.
			</div>
		</noscript>
	</body>
</html>
