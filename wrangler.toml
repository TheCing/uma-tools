# Cloudflare Pages project config (uma-tools).
#
# Without this file the build log reports "No Wrangler configuration file found",
# which can leave Pages Functions without a compatibility date and silently not
# execute in production (the [[catchall]] + events + canva functions all compile and
# upload but never run). Pinning a compatibility date here makes the Functions worker
# run the same way it does under local `wrangler pages dev`.
#
# pages_build_output_dir = "." because build-all.sh builds in place at the repo root
# (the Pages "build output directory" is /).
name = "uma-tools"
pages_build_output_dir = "."
compatibility_date = "2024-05-01"
