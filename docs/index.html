<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uma Musume Simulator Documentation</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --bg-sidebar: #f5f5f5;
            --fg: #333333;
            --fg-muted: #666666;
            --border: #e0e0e0;
            --accent: #79d823;
            --accent-dark: #5ba318;
            --link: #2563eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --bg-sidebar: #252525;
                --fg: #e0e0e0;
                --fg-muted: #999999;
                --border: #404040;
                --accent: #79d823;
                --accent-dark: #5ba318;
                --link: #60a5fa;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 20px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar h1 {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .sidebar nav a {
            display: block;
            padding: 8px 12px;
            color: var(--fg);
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 4px;
            transition: background 0.2s;
        }

        .sidebar nav a:hover {
            background: var(--border);
        }

        .sidebar nav a.active {
            background: var(--accent);
            color: white;
        }

        .content {
            flex: 1;
            margin-left: 260px;
            padding: 40px 60px;
            max-width: 900px;
        }

        .content h1 {
            font-size: 2em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent);
        }

        .content h2 {
            font-size: 1.5em;
            margin-top: 40px;
            margin-bottom: 15px;
            color: var(--accent-dark);
        }

        .content h3 {
            font-size: 1.2em;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        .content p {
            margin-bottom: 15px;
        }

        .content ul, .content ol {
            margin-bottom: 15px;
            padding-left: 25px;
        }

        .content li {
            margin-bottom: 8px;
        }

        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .content th, .content td {
            padding: 10px 15px;
            border: 1px solid var(--border);
            text-align: left;
        }

        .content th {
            background: var(--bg-sidebar);
            font-weight: 600;
        }

        .content code {
            background: var(--bg-sidebar);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 0.9em;
        }

        .content pre {
            background: var(--bg-sidebar);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 15px 0;
        }

        .content pre code {
            padding: 0;
            background: none;
        }

        .content a {
            color: var(--link);
        }

        .content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 30px 0;
        }

        .content blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 20px;
            margin: 15px 0;
            color: var(--fg-muted);
        }

        .content strong {
            color: var(--fg);
        }

        /* Heading anchor links */
        .content h1, .content h2, .content h3, .content h4 {
            position: relative;
        }

        .heading-anchor {
            position: absolute;
            left: -1.5em;
            opacity: 0;
            padding-right: 0.5em;
            color: var(--fg-muted);
            text-decoration: none;
            font-weight: normal;
            transition: opacity 0.2s;
            cursor: pointer;
        }

        .content h1:hover .heading-anchor,
        .content h2:hover .heading-anchor,
        .content h3:hover .heading-anchor,
        .content h4:hover .heading-anchor,
        .heading-anchor:hover {
            opacity: 1;
        }

        .heading-anchor:hover {
            color: var(--accent);
        }

        .heading-anchor svg {
            width: 0.75em;
            height: 0.75em;
            vertical-align: middle;
        }

        /* Copied tooltip */
        .heading-anchor.copied::after {
            content: 'Copied!';
            position: absolute;
            left: 100%;
            top: 50%;
            transform: translateY(-50%);
            background: var(--fg);
            color: var(--bg);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75em;
            white-space: nowrap;
            animation: fadeOut 1.5s forwards;
        }

        @keyframes fadeOut {
            0%, 70% { opacity: 1; }
            100% { opacity: 0; }
        }

        @media (max-width: 768px) {
            .sidebar {
                position: static;
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .content {
                margin-left: 0;
                padding: 20px;
            }

            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h1>Uma Simulator Docs</h1>
            <nav>
                <a href="#" data-doc="README.md" class="active">Home</a>
                <a href="#" data-doc="RACE-MECHANICS-RESEARCH.md">Race Mechanics</a>
                <a href="#" data-doc="SPURT-SURVIVAL-RATE.md">Spurt Survival Rate</a>
                <a href="#" data-doc="JP-GLOBAL-TERMINOLOGY.md">JP↔Global Terms</a>
                <a href="#" data-doc="stats-guide.md">Stats Guide</a>
                <a href="#" data-doc="stamina-and-survival.md">Stamina & Survival</a>
                <a href="#" data-doc="terminology.md">Terminology</a>
                <a href="#" data-doc="team-sirius-guide-en.md">Team Sirius Guide</a>
                <a href="#" data-doc="throne-guide.md">Throne's Assemblage Guide</a>
            </nav>
        </aside>
        <main class="content" id="content">
            <p>Loading documentation...</p>
        </main>
    </div>

    <script>
        const contentEl = document.getElementById('content');
        const navLinks = document.querySelectorAll('.sidebar nav a');

        // Link icon SVG
        const linkIconSvg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" fill="currentColor">
            <path d="M4.715 6.542 3.343 7.914a3 3 0 1 0 4.243 4.243l1.828-1.829A3 3 0 0 0 8.586 5.5L8 6.086a1.002 1.002 0 0 0-.154.199 2 2 0 0 1 .861 3.337L6.88 11.45a2 2 0 1 1-2.83-2.83l.793-.792a4.018 4.018 0 0 1-.128-1.287z"/>
            <path d="M6.586 4.672A3 3 0 0 0 7.414 9.5l.775-.776a2 2 0 0 1-.896-3.346L9.12 3.55a2 2 0 1 1 2.83 2.83l-.793.792c.112.42.155.855.128 1.287l1.372-1.372a3 3 0 1 0-4.243-4.243L6.586 4.672z"/>
        </svg>`;

        // Generate slug from heading text (matches marked.js default behavior)
        function slugify(text) {
            return text
                .toLowerCase()
                .trim()
                .replace(/[^\w\s-]/g, '')  // Remove special chars except spaces and hyphens
                .replace(/\s+/g, '-')       // Replace spaces with hyphens
                .replace(/-+/g, '-');       // Collapse multiple hyphens
        }

        // Add IDs to headings that don't have them
        function addHeadingIds() {
            const headings = contentEl.querySelectorAll('h1, h2, h3, h4, h5, h6');
            const usedIds = new Set();
            headings.forEach(heading => {
                if (!heading.id) {
                    let baseId = slugify(heading.textContent);
                    let id = baseId;
                    let counter = 1;
                    // Ensure unique IDs
                    while (usedIds.has(id)) {
                        id = baseId + '-' + counter++;
                    }
                    heading.id = id;
                }
                usedIds.add(heading.id);
            });
        }

        function addHeadingAnchors() {
            const headings = contentEl.querySelectorAll('h1, h2, h3, h4');
            headings.forEach(heading => {
                if (!heading.id) return;

                const anchor = document.createElement('a');
                anchor.className = 'heading-anchor';
                anchor.innerHTML = linkIconSvg;
                anchor.title = 'Copy link to this section';
                anchor.setAttribute('aria-label', 'Copy link to section');

                anchor.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const docBase = currentDoc.replace('.md', '');
                    const url = window.location.href.split('#')[0] + '#' + docBase + ':' + heading.id;
                    navigator.clipboard.writeText(url).then(() => {
                        anchor.classList.add('copied');
                        setTimeout(() => anchor.classList.remove('copied'), 1500);
                    });
                });

                heading.insertBefore(anchor, heading.firstChild);
            });
        }

        async function loadDoc(filename) {
            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error('Failed to load');
                const markdown = await response.text();
                contentEl.innerHTML = marked.parse(markdown);

                // Track current doc
                currentDoc = filename;

                // Add IDs to headings (marked.js doesn't do this by default)
                addHeadingIds();

                // Add anchor links to headings
                addHeadingAnchors();

                // Update active nav link
                navLinks.forEach(link => {
                    link.classList.toggle('active', link.dataset.doc === filename);
                });

                // Update URL hash (only update if not already set with section)
                const currentHash = window.location.hash.slice(1);
                const docBase = filename.replace('.md', '');
                if (!currentHash.startsWith(docBase + ':')) {
                    history.replaceState(null, '', '#' + docBase);
                }

                // Scroll to top
                contentEl.scrollTop = 0;
                window.scrollTo(0, 0);
            } catch (error) {
                contentEl.innerHTML = '<p>Error loading documentation. Please try again.</p>';
            }
        }

        // Track current document
        let currentDoc = 'README.md';

        // Handle nav clicks
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                loadDoc(link.dataset.doc);
            });
        });

        // Handle internal anchor link clicks (TOC links)
        contentEl.addEventListener('click', (e) => {
            const link = e.target.closest('a');
            if (!link) return;

            const href = link.getAttribute('href');
            if (href && href.startsWith('#')) {
                e.preventDefault();
                const targetId = href.slice(1);
                const target = document.getElementById(targetId);
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                    // Update URL without triggering hashchange reload
                    history.pushState(null, '', `#${currentDoc.replace('.md', '')}:${targetId}`);
                }
            }
        });

        // Handle initial load and hash changes
        function loadFromHash() {
            const hash = window.location.hash.slice(1);
            if (!hash) {
                loadDoc('README.md');
                return;
            }

            // Check if hash contains a section anchor (doc:section format)
            const colonIndex = hash.indexOf(':');
            if (colonIndex > 0) {
                const docName = hash.slice(0, colonIndex) + '.md';
                const sectionId = hash.slice(colonIndex + 1);
                if (currentDoc !== docName) {
                    loadDoc(docName).then(() => {
                        const target = document.getElementById(sectionId);
                        if (target) target.scrollIntoView({ behavior: 'smooth' });
                    });
                } else {
                    const target = document.getElementById(sectionId);
                    if (target) target.scrollIntoView({ behavior: 'smooth' });
                }
                return;
            }

            // Simple doc hash (no colon) - load the doc
            loadDoc(hash + '.md');
        }

        window.addEventListener('hashchange', loadFromHash);
        loadFromHash();
    </script>
</body>
</html>
