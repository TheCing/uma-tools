<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uma Musume Simulator Documentation</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #ffffff;
            --bg-sidebar: #f5f5f5;
            --fg: #333333;
            --fg-muted: #666666;
            --border: #e0e0e0;
            --accent: #79d823;
            --accent-dark: #5ba318;
            --link: #2563eb;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg: #1a1a1a;
                --bg-sidebar: #252525;
                --fg: #e0e0e0;
                --fg-muted: #999999;
                --border: #404040;
                --accent: #79d823;
                --accent-dark: #5ba318;
                --link: #60a5fa;
            }
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: var(--bg);
            color: var(--fg);
            line-height: 1.6;
        }

        .container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 260px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            padding: 20px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar h1 {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: var(--accent);
        }

        .sidebar nav a {
            display: block;
            padding: 8px 12px;
            color: var(--fg);
            text-decoration: none;
            border-radius: 6px;
            margin-bottom: 4px;
            transition: background 0.2s;
        }

        .sidebar nav a:hover {
            background: var(--border);
        }

        .sidebar nav a.active {
            background: var(--accent);
            color: white;
        }

        .content {
            flex: 1;
            margin-left: 260px;
            padding: 40px 60px;
            max-width: 900px;
        }

        .content h1 {
            font-size: 2em;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--accent);
        }

        .content h2 {
            font-size: 1.5em;
            margin-top: 40px;
            margin-bottom: 15px;
            color: var(--accent-dark);
        }

        .content h3 {
            font-size: 1.2em;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        .content p {
            margin-bottom: 15px;
        }

        .content ul, .content ol {
            margin-bottom: 15px;
            padding-left: 25px;
        }

        .content li {
            margin-bottom: 8px;
        }

        .content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        .content th, .content td {
            padding: 10px 15px;
            border: 1px solid var(--border);
            text-align: left;
        }

        .content th {
            background: var(--bg-sidebar);
            font-weight: 600;
        }

        .content code {
            background: var(--bg-sidebar);
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'SF Mono', Monaco, 'Courier New', monospace;
            font-size: 0.9em;
        }

        .content pre {
            background: var(--bg-sidebar);
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 15px 0;
        }

        .content pre code {
            padding: 0;
            background: none;
        }

        .content a {
            color: var(--link);
        }

        .content hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 30px 0;
        }

        .content blockquote {
            border-left: 4px solid var(--accent);
            padding-left: 20px;
            margin: 15px 0;
            color: var(--fg-muted);
        }

        .content strong {
            color: var(--fg);
        }

        @media (max-width: 768px) {
            .sidebar {
                position: static;
                width: 100%;
                height: auto;
                border-right: none;
                border-bottom: 1px solid var(--border);
            }

            .content {
                margin-left: 0;
                padding: 20px;
            }

            .container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <h1>Uma Simulator Docs</h1>
            <nav>
                <a href="#" data-doc="README.md" class="active">Home</a>
                <a href="#" data-doc="RACE-MECHANICS-RESEARCH.md">Race Mechanics</a>
                <a href="#" data-doc="SPURT-SURVIVAL-RATE.md">Spurt Survival Rate</a>
                <a href="#" data-doc="JP-GLOBAL-TERMINOLOGY.md">JP↔Global Terms</a>
                <a href="#" data-doc="stats-guide.md">Stats Guide</a>
                <a href="#" data-doc="stamina-and-survival.md">Stamina & Survival</a>
                <a href="#" data-doc="terminology.md">Terminology</a>
            </nav>
        </aside>
        <main class="content" id="content">
            <p>Loading documentation...</p>
        </main>
    </div>

    <script>
        const contentEl = document.getElementById('content');
        const navLinks = document.querySelectorAll('.sidebar nav a');

        async function loadDoc(filename) {
            try {
                const response = await fetch(filename);
                if (!response.ok) throw new Error('Failed to load');
                const markdown = await response.text();
                contentEl.innerHTML = marked.parse(markdown);

                // Update active nav link
                navLinks.forEach(link => {
                    link.classList.toggle('active', link.dataset.doc === filename);
                });

                // Update URL hash
                window.location.hash = filename.replace('.md', '');
            } catch (error) {
                contentEl.innerHTML = '<p>Error loading documentation. Please try again.</p>';
            }
        }

        // Handle nav clicks
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                loadDoc(link.dataset.doc);
            });
        });

        // Handle initial load and hash changes
        function loadFromHash() {
            const hash = window.location.hash.slice(1);
            const doc = hash ? hash + '.md' : 'README.md';
            loadDoc(doc);
        }

        window.addEventListener('hashchange', loadFromHash);
        loadFromHash();
    </script>
</body>
</html>
